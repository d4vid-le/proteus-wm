name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core tests
        # Vision tests need downloaded encoder weights and macOS capture
        # permissions; they run locally but are excluded from CI.
        run: pytest tests/test_core.py -q -k "not vision"
